<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OptiRoute BCN Pro</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#ffffff;color:#111827}
header{background:#ffffff;padding:1rem 1.5rem;border-bottom:1px solid #334155}
header h1{margin:0;font-size:1.4rem}
header p{margin:.25rem 0 0;opacity:.7;font-size:.9rem}
nav{display:flex;gap:.5rem;padding:1rem 1.5rem;flex-wrap:wrap}
nav button{background:#f3f4f6;color:#111827;border:none;padding:.5rem .9rem;border-radius:6px;cursor:pointer}
nav button.active{background:#2563eb}
main{max-width:1200px;margin:0 auto;padding:1rem 1.5rem}
.card{background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;gap:1rem}
.grid2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
input,select,textarea{width:100%;padding:.5rem;border:1px solid #e5e7eb;border-radius:6px;background:#ffffff;color:#111827}
label{font-size:.85rem;display:block;margin-bottom:.3rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:.5rem;border-bottom:1px solid #334155;text-align:left}
th{background:#f8fafc}
.badge{display:inline-block;padding:.15rem .45rem;border-radius:999px;font-size:.7rem;background:#f3f4f6}
.btn{background:#2563eb;color:#fff;border:none;padding:.45rem .8rem;border-radius:6px;cursor:pointer;font-size:.85rem}
.btn.secondary{background:#e5e7eb}
.btn.danger{background:#dc2626}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 180px}
.kpi{font-size:1.3rem;font-weight:700}
.muted{color:#6b7280;font-size:.8rem}
.hidden{display:none}
.checklist li{margin:.4rem 0;list-style:none}
.checklist input{width:auto;margin-right:.5rem}
@media (max-width: 640px) {
  .row { flex-direction: column; }
  .row > * { flex: 1 1 100%; }
  table { display: block; overflow-x: auto; white-space: nowrap; }
  nav { flex-wrap: wrap; }
  nav button { flex: 1 1 45%; }
}
.hamburger{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#111827;}
@media (max-width: 768px){
  .hamburger{display:block;}
  #mainNav{display:none;flex-direction:column;}
  #mainNav.open{display:flex;}
}
</head>
<body>
<header>
<div style="display:flex;justify-content:space-between;align-items:center;">
<div>
<h1>OptiRoute BCN Pro</h1>
<p>Vehicle transport missions in Barcelona · ONLOGIST · Otoqi · DriiveMe</p>
</div>
<button id="hamburger" class="hamburger" aria-label="Menu">☰</button>
</div>
</header>
<nav id="mainNav">
<button class="tab active" data-tab="about">About</button>
<button class="tab" data-tab="instructions">Instructions</button>
<button class="tab" data-tab="dashboard">Dashboard</button>
<button class="tab" data-tab="missions">Missions</button>
<button class="tab" data-tab="chain">Chain trips</button>
<button class="tab" data-tab="add">Add mission</button>
<button class="tab" data-tab="checklist">Day checklist</button>
<button class="tab" data-tab="links">Links</button>
<button class="tab" data-tab="providers">Providers</button>
<button class="tab" data-tab="config">API config</button>
</nav>
<main>
<section id="about" class="tabcontent">
<div class="card">
<h2>About</h2>
<p>OptiRoute BCN Pro helps vehicle transport freelancers manage missions, calculate net profit, chain trips and track daily operations.</p>
<p>Developed in Barcelona by <a href="https://xarop.com" target="_blank">xarop.com</a>.</p>
</div>
</section>
<section id="instructions" class="tabcontent hidden">
<div class="card">
<h2>Instructions</h2>
<ol>
<li>Add missions manually or import JSON offers.</li>
<li>Filter by platform, destination, min net profit, max duration.</li>
<li>Use Chain trips to combine missions.</li>
<li>Use Route planner to find multi-leg routes.</li>
<li>Track your day with the checklist.</li>
<li>Configure API access in API config.</li>
</ol>
</div>
</section>
<section id="dashboard" class="tabcontent hidden">
<div class="grid grid2">
<div class="card"><div class="muted">Available missions</div><div class="kpi" id="kpiMissions">0</div></div>
<div class="card"><div class="muted">Total net profit</div><div class="kpi" id="kpiNet">0 €</div></div>
<div class="card"><div class="muted">Total km</div><div class="kpi" id="kpiKm">0</div></div>
<div class="card"><div class="muted">Total time</div><div class="kpi" id="kpiTime">0 h</div></div>
</div>
<div class="card">
<h3>Filters</h3>
<div class="row">
<label>Platform<select id="filterPlatform"><option value="">All</option><option>ONLOGIST</option><option>Otoqi</option><option>DriiveMe</option></select></label>
<label>Destination<select id="filterDest"><option value="">All</option></select></label>
<label>Min net profit (€)<input id="filterMinNet" type="number" value="0"></label>
<label>Max duration (min)<input id="filterMaxDur" type="number" value="9999"></label>
</div>
</div>
<div class="card"><h3>Filtered missions</h3><div id="filteredTable"></div></div>
</section>
<section id="missions" class="tabcontent hidden">
<div class="card"><h3>BCN mission database</h3><div id="missionsTable"></div></div>
</section>
<section id="chain" class="tabcontent hidden">
<div class="card">
<h3>Route planner (combine missions)</h3>
<p class="muted">Find multi-leg routes from origin to destination using available missions.</p>
<div class="row">
<label>Origin<input id="planOrigin" value="Barcelona El Prat T1"></label>
<label>Destination<input id="planDest" value="Barcelona El Prat T1"></label>
<label>Max legs<input id="planMax" type="number" value="4"></label>
</div>
<button class="btn" id="planRouteBtn">Find combined route</button>
<div id="planResults" style="margin-top:1rem"></div>
</div>
<div class="card">
<h3>Round-trip chain builder</h3>
<p class="muted">Select an outbound mission to find compatible return/intermediate legs by destination.</p>
<label>Outbound mission<select id="chainOrigin"></select></label>
<button class="btn" id="buildChainBtn">Build chains</button>
<div id="chainResults" style="margin-top:1rem"></div>
</div>
</section>
<section id="add" class="tabcontent hidden">
<div class="card">
<h3>Add live mission</h3>
<div class="row">
<label>Platform<select id="addPlatform"><option>ONLOGIST</option><option>Otoqi</option><option>DriiveMe</option></select></label>
<label>Origin<input id="addOrigin" value="Barcelona El Prat T1"></label>
<label>Destination<input id="addDest" value="Madrid Barajas"></label>
<label>Distancia km<input id="addKm" type="number" value="620"></label>
<label>Duracion min<input id="addDur" type="number" value="390"></label>
<label>Tarifa bruta €<input id="addGross" type="number" value="180"></label>
<label>Combustible €<input id="addFuel" type="number" value="45"></label>
<label>Peajes €<input id="addTolls" type="number" value="38"></label>
<label>Transito €<input id="addTransit" type="number" value="0"></label>
<label>Prorrata autónomo €/dia<input id="addFee" type="number" value="0"></label>
<label>Days<input id="addDays" type="number" value="1"></label>
<label>Reembolsable<input id="addReimb" type="checkbox"></label>
</div>
<button class="btn" id="addMissionBtn">Save mission</button>
<div style="margin-top:1rem">
<h4>Import offers (JSON)</h4>
<textarea id="bulkJson" rows="6" placeholder='[{"platform":"ONLOGIST","origin":"...","destination":"...","distanceKm":100,"durationMin":60,"gross":50,"fuel":8,"tolls":5,"transit":0,"fee":0,"days":1,"reimb":false}]'></textarea>
<button class="btn secondary" id="importJsonBtn">Import</button>
</div>
</div>
</section>
<section id="checklist" class="tabcontent hidden">
<div class="card">
<h3>Day checklist</h3>
<ul class="checklist" id="checklistItems"></ul>
<div class="row">
<label>Initial km<input id="startKm" type="number" value="0"></label>
<label>Initial fuel level<input id="startFuel" type="number" value="100"></label>
<label>Digital signature<input id="signature" placeholder="Name del conductor"></label>
</div>
<button class="btn" id="saveChecklistBtn">Save state</button>
<div id="checklistStatus" class="muted" style="margin-top:.5rem"></div>
</div>
</section>
<section id="links" class="tabcontent hidden">
<div class="card">
<h3>Quick platform links</h3>
<div class="row">
<a class="btn" href="https://www.onlogist.com/" target="_blank">ONLOGIST Driver</a>
<a class="btn" href="https://en.otoqi.com/" target="_blank">Otoqi</a>
<a class="btn" href="https://www.driiveme.com/" target="_blank">DriiveMe</a>
</div>
</div>
</section>
<section id="providers" class="tabcontent hidden">
<div class="card">
<h3>Provider management</h3>
<p class="muted">Add or remove platforms (ONLOGIST, Otoqi, DriiveMe or others).</p>
<div class="row">
<label>Name<input id="provName" placeholder="Nuevo proveedor"></label>
<label>URL<input id="provUrl" placeholder="https://..."></label>
</div>
<button class="btn" id="addProvBtn">Add provider</button>
<div id="providersTable" style="margin-top:1rem"></div>
</div>
</section>
<section id="config" class="tabcontent hidden">
<div class="card">
<h3>API configuration</h3>
<p class="muted">Guarda endpoints y claves. Si un proveedor no ofrece API pública, usa la ingesta manual en "Añadir misión".</p>
<div id="configForms"></div>
</div>
<div class="card">
<h3>How to get credentials</h3>
<ul>
<li><strong>ONLOGIST:</strong> plataforma B2B. Solicita acceso API en su portal de desarrolladores / soporte (dev.portal.onlogist.com). Requiere cuenta de empresa.</li>
<li><strong>Otoqi:</strong> plataforma B2B. Contacta con Otoqi para integración API (no hay registro self-serve público).</li>
<li><strong>DriiveMe:</strong> API para partners. Crea cuenta y solicita clave API a soporte DriiveMe.</li>
</ul>
</div>
</section>
</main>
<script>
const STORAGE_KEY = "optiroute_bcn_pro_v1";
const defaultMissions = [
 {id:1,platform:"ONLOGIST",origin:"Barcelona El Prat T1",destination:"Madrid Barajas",distanceKm:620,durationMin:390,gross:180,fuel:45,tolls:38,transit:0,fee:0,days:1,reimb:false},
 {id:2,platform:"ONLOGIST",origin:"Madrid Barajas",destination:"Barcelona El Prat T1",distanceKm:620,durationMin:390,gross:175,fuel:45,tolls:38,transit:0,fee:0,days:1,reimb:false},
 {id:3,platform:"Otoqi",origin:"Barcelona Sants",destination:"Valencia Manises",distanceKm:350,durationMin:230,gross:110,fuel:28,tolls:22,transit:15,fee:0,days:1,reimb:false},
 {id:4,platform:"Otoqi",origin:"Valencia Manises",destination:"Barcelona Sants",distanceKm:350,durationMin:230,gross:105,fuel:28,tolls:22,transit:15,fee:0,days:1,reimb:false},
 {id:5,platform:"DriiveMe",origin:"Barcelona Zona Franca",destination:"Zaragoza Plaza",distanceKm:295,durationMin:190,gross:95,fuel:22,tolls:18,transit:0,fee:0,days:1,reimb:false},
 {id:6,platform:"DriiveMe",origin:"Zaragoza Plaza",destination:"Barcelona Zona Franca",distanceKm:295,durationMin:190,gross:90,fuel:22,tolls:18,transit:0,fee:0,days:1,reimb:false},
 {id:7,platform:"ONLOGIST",origin:"Barcelona Martorell",destination:"Girona",distanceKm:110,durationMin:75,gross:55,fuel:9,tolls:6,transit:0,fee:0,days:1,reimb:false},
 {id:8,platform:"ONLOGIST",origin:"Girona",destination:"Barcelona Martorell",distanceKm:110,durationMin:75,gross:50,fuel:9,tolls:6,transit:0,fee:0,days:1,reimb:false},
 {id:9,platform:"Otoqi",origin:"Barcelona Badalona",destination:"Tarragona",distanceKm:95,durationMin:70,gross:48,fuel:8,tolls:5,transit:0,fee:0,days:1,reimb:false},
 {id:10,platform:"Otoqi",origin:"Tarragona",destination:"Barcelona Badalona",distanceKm:95,durationMin:70,gross:45,fuel:8,tolls:5,transit:0,fee:0,days:1,reimb:false},
 {id:11,platform:"DriiveMe",origin:"Barcelona El Prat T2",destination:"Madrid Atocha",distanceKm:625,durationMin:400,gross:185,fuel:46,tolls:38,transit:20,fee:0,days:1,reimb:false},
 {id:12,platform:"DriiveMe",origin:"Madrid Atocha",destination:"Barcelona El Prat T2",distanceKm:625,durationMin:400,gross:180,fuel:46,tolls:38,transit:20,fee:0,days:1,reimb:false}
];
let missions = loadMissions();
let checklistState = loadChecklist();
const defaultProviders = [
 {name:"ONLOGIST",url:"https://www.onlogist.com/"},
 {name:"Otoqi",url:"https://en.otoqi.com/"},
 {name:"DriiveMe",url:"https://www.driiveme.com/"}
];
let providers = loadProviders();
function loadProviders(){
  try{const raw=localStorage.getItem(STORAGE_KEY+"_providers"); if(raw) return JSON.parse(raw);}catch(e){}
  return [...defaultProviders];
}
function saveProviders(){localStorage.setItem(STORAGE_KEY+"_providers",JSON.stringify(providers));}
function loadMissions(){
  try{const raw=localStorage.getItem(STORAGE_KEY+"_missions"); if(raw) return JSON.parse(raw);}catch(e){}
  return [...defaultMissions];
}
function saveMissions(){localStorage.setItem(STORAGE_KEY+"_missions",JSON.stringify(missions));}
function loadChecklist(){
  try{const raw=localStorage.getItem(STORAGE_KEY+"_checklist"); if(raw) return JSON.parse(raw);}catch(e){}
  return {startKm:0,startFuel:100,signature:"",items:{}};
}
function saveChecklist(){localStorage.setItem(STORAGE_KEY+"_checklist",JSON.stringify(checklistState));}
function netProfit(m){
  const expenses = (m.fuel||0)+(m.tolls||0)+(m.transit||0)+((m.fee||0)*(m.days||1));
  let net = (m.gross||0)-expenses;
  if(m.reimb){ net = (m.gross||0); }
  return Number(net.toFixed(2));
}
function formatDuration(min){const h=Math.floor(min/60);const m=Math.round(min%60);if(h===0)return m+" min";return h+" h "+m+" min";}
function renderKPIs(list){
  document.getElementById("kpiMissions").textContent=list.length;
  document.getElementById("kpiNet").textContent=list.reduce((s,m)=>s+netProfit(m),0).toFixed(2)+" €";
  document.getElementById("kpiKm").textContent=list.reduce((s,m)=>s+(m.distanceKm||0),0).toFixed(0);
  document.getElementById("kpiTime").textContent=(list.reduce((s,m)=>s+(m.durationMin||0),0)/60).toFixed(1);
}
function applyFilters(){
  const platform=document.getElementById("filterPlatform").value;
  const dest=document.getElementById("filterDest").value;
  const minNet=parseFloat(document.getElementById("filterMinNet").value)||0;
  const maxDur=parseFloat(document.getElementById("filterMaxDur").value)||9999;
  return missions.filter(m=>{
    if(platform && m.platform!==platform) return false;
    if(dest && m.destination!==dest) return false;
    if(netProfit(m)<minNet) return false;
    if((m.durationMin||0)>maxDur) return false;
    return true;
  });
}
function renderTable(containerId,list){
  const el=document.getElementById(containerId);
  if(!list.length){el.innerHTML="<p class='muted'>No results</p>";return;}
  let html="<table><thead><tr><th>Plat</th><th>Origin</th><th>Destination</th><th>km</th><th>Time</th><th>Gross</th><th>Net</th></tr></thead><tbody>";
  for(const m of list){
    html+="<tr><td><span class='badge'>"+m.platform+"</span></td><td>"+m.origin+"</td><td>"+m.destination+"</td><td>"+m.distanceKm+"</td><td>"+formatDuration(m.durationMin)+"</td><td>"+m.gross+"€</td><td><strong>"+netProfit(m)+"€</strong></td></tr>";
  }
  html+="</tbody></table>";
  el.innerHTML=html;
}
function populateDestFilter(){
  const sel=document.getElementById("filterDest");
  const dests=[...new Set(missions.map(m=>m.destination))];
  sel.innerHTML="<option value=''>All</option>"+dests.map(d=>"<option>"+d+"</option>").join("");
}
function populatePlatformSelects(){
  const names = providers.map(p=>p.name);
  const filterSel = document.getElementById("filterPlatform");
  const currentFilter = filterSel.value;
  filterSel.innerHTML = "<option value=''>All</option>" + names.map(n=>"<option>"+n+"</option>").join("");
  if(names.includes(currentFilter)) filterSel.value=currentFilter;
  const addSel = document.getElementById("addPlatform");
  const currentAdd = addSel.value;
  addSel.innerHTML = names.map(n=>"<option>"+n+"</option>").join("");
  if(names.includes(currentAdd)) addSel.value=currentAdd; else if(names.length) addSel.value=names[0];
}
function renderProviders(){
  const el=document.getElementById("providersTable");
  if(!providers.length){el.innerHTML="<p class='muted'>No providers</p>";return;}
  let html="<table><thead><tr><th>Name</th><th>URL</th><th></th></tr></thead><tbody>";
  for(const p of providers){
    html+="<tr><td>"+p.name+"</td><td><a href='"+p.url+"' target='_blank'>"+p.url+"</a></td><td><button class='btn danger' data-del='"+p.name+"'>Delete</button></td></tr>";
  }
  html+="</tbody></table>";
  el.innerHTML=html;
  const linksRow = document.querySelector("#links .row");
  if(linksRow){ linksRow.innerHTML = providers.map(p=>"<a class='btn' href='"+p.url+"' target='_blank'>"+p.name+"</a>").join(""); }
}
function loadApiConfig(){try{const raw=localStorage.getItem(STORAGE_KEY+"_apiconfig");if(raw)return JSON.parse(raw);}catch(e){}return {};}
function saveApiConfig(cfg){localStorage.setItem(STORAGE_KEY+"_apiconfig",JSON.stringify(cfg));}
let apiConfig = loadApiConfig();
function renderConfigForms(){
  const el=document.getElementById("configForms");
  let html="";
  for(const p of providers){
    const c=apiConfig[p.name]||{baseUrl:"",apiKey:"",enabled:false};
    html+="<div class='card'><h4>"+p.name+"</h4><div class='row'><label>Base URL<input data-prov='"+p.name+"' class='cfg-url' value='"+(c.baseUrl||"")+"'></label><label>API Key<input data-prov='"+p.name+"' class='cfg-key' value='"+(c.apiKey||"")+"'></label><label>Active<input data-prov='"+p.name+"' class='cfg-enabled' type='checkbox' "+(c.enabled?"checked":"")+"></label></div><button class='btn cfg-save' data-prov='"+p.name+"'>Guardar</button></div>";
  }
  el.innerHTML=html;
  el.querySelectorAll(".cfg-save").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const name=btn.dataset.prov;
      const url=el.querySelector(".cfg-url[data-prov='"+name+"']").value;
      const key=el.querySelector(".cfg-key[data-prov='"+name+"']").value;
      const enabled=el.querySelector(".cfg-enabled[data-prov='"+name+"']").checked;
      apiConfig[name]={baseUrl:url,apiKey:key,enabled};
      saveApiConfig(apiConfig);
      alert("Config saved for "+name);
    });
  });
}
function renderAll(){
  populatePlatformSelects();
  populateDestFilter();
  const filtered=applyFilters();
  renderKPIs(filtered);
  renderTable("filteredTable",filtered);
  renderTable("missionsTable",missions);
  const co=document.getElementById("chainOrigin");
  co.innerHTML=missions.map(m=>"<option value='"+m.id+"'>"+m.platform+" · "+m.origin+" → "+m.destination+" ("+netProfit(m)+"€)</option>").join("");
  renderProviders();
  renderConfigForms();
}
function switchTab(name){
  document.querySelectorAll(".tabcontent").forEach(s=>s.classList.add("hidden"));
  document.getElementById(name).classList.remove("hidden");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
}
document.getElementById("hamburger").addEventListener("click",()=>{
  document.getElementById("mainNav").classList.toggle("open");
});
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
document.getElementById("filterPlatform").addEventListener("change",renderAll);
document.getElementById("filterDest").addEventListener("change",renderAll);
document.getElementById("filterMinNet").addEventListener("input",renderAll);
document.getElementById("filterMaxDur").addEventListener("input",renderAll);
document.getElementById("addMissionBtn").addEventListener("click",()=>{
  const m={
    id:Date.now(),
    platform:document.getElementById("addPlatform").value,
    origin:document.getElementById("addOrigin").value,
    destination:document.getElementById("addDest").value,
    distanceKm:parseFloat(document.getElementById("addKm").value)||0,
    durationMin:parseFloat(document.getElementById("addDur").value)||0,
    gross:parseFloat(document.getElementById("addGross").value)||0,
    fuel:parseFloat(document.getElementById("addFuel").value)||0,
    tolls:parseFloat(document.getElementById("addTolls").value)||0,
    transit:parseFloat(document.getElementById("addTransit").value)||0,
    fee:parseFloat(document.getElementById("addFee").value)||0,
    days:parseFloat(document.getElementById("addDays").value)||1,
    reimb:document.getElementById("addReimb").checked
  };
  missions.push(m);
  saveMissions();
  renderAll();
  alert("Mission saved");
});
document.getElementById("importJsonBtn").addEventListener("click",()=>{
  try{
    const arr=JSON.parse(document.getElementById("bulkJson").value);
    if(!Array.isArray(arr)) throw new Error("Must be an array");
    for(const m of arr){ m.id=m.id||Date.now()+Math.random(); missions.push(m); }
    saveMissions(); renderAll(); alert("Imported "+arr.length+" missions");
  }catch(e){ alert("JSON error: "+e.message); }
});
document.getElementById("planRouteBtn").addEventListener("click",()=>{
  const origin=document.getElementById("planOrigin").value.trim().toLowerCase();
  const dest=document.getElementById("planDest").value.trim().toLowerCase();
  const maxLegs=parseInt(document.getElementById("planMax").value)||4;
  const results=[];
  function dfs(current, visited, path, totalNet, totalKm, totalMin){
    if(current===dest && path.length>0){ results.push({path:[...path], totalNet, totalKm, totalMin}); }
    if(path.length>=maxLegs) return;
    for(const m of missions){
      if(visited.has(m.id)) continue;
      if(m.origin.toLowerCase()!==current) continue;
      visited.add(m.id);
      path.push(m);
      dfs(m.destination.toLowerCase(), visited, path, totalNet+netProfit(m), totalKm+m.distanceKm, totalMin+m.durationMin);
      path.pop();
      visited.delete(m.id);
    }
  }
  dfs(origin, new Set(), [], 0, 0, 0);
  // sort by net profit desc
  results.sort((a,b)=>b.totalNet-a.totalNet);
  const el=document.getElementById("planResults");
  if(!results.length){el.innerHTML="<p class='muted'>No combined routes found.</p>";return;}
  let html="<table><thead><tr><th>Route</th><th>Net</th><th>Km</th><th>Time</th></tr></thead><tbody>";
  for(const r of results.slice(0,20)){
    html+="<tr><td>"+r.path.map(m=>m.origin+"→"+m.destination+" ("+m.platform+")").join(" | ")+"</td><td><strong>"+r.totalNet.toFixed(2)+"€</strong></td><td>"+r.totalKm+"</td><td>"+formatDuration(r.totalMin)+"</td></tr>";
  }
  html+="</tbody></table>";
  el.innerHTML=html;
});
  const id=parseInt(document.getElementById("chainOrigin").value);
  const origin=missions.find(m=>m.id===id);
  if(!origin){return;}
  const chains=[];
  for(const m2 of missions){
    if(m2.id===origin.id) continue;
    if(m2.origin.toLowerCase()===origin.destination.toLowerCase()){
      chains.push({first:origin,second:m2,totalNet:netProfit(origin)+netProfit(m2),totalKm:origin.distanceKm+m2.distanceKm,totalMin:origin.durationMin+m2.durationMin});
    }
  }
  const el=document.getElementById("chainResults");
  if(!chains.length){el.innerHTML="<p class='muted'>No compatible chains found.</p>";return;}
  let html="<table><thead><tr><th>Outbound</th><th>Return/Intermediate</th><th>Net total</th><th>Km</th><th>Time</th></tr></thead><tbody>";
  for(const c of chains){
    html+="<tr><td>"+c.first.platform+" "+c.first.origin+"→"+c.first.destination+"</td><td>"+c.second.platform+" "+c.second.origin+"→"+c.second.destination+"</td><td><strong>"+c.totalNet.toFixed(2)+"€</strong></td><td>"+c.totalKm+"</td><td>"+formatDuration(c.totalMin)+"</td></tr>";
  }
  html+="</tbody></table>";
  el.innerHTML=html;
});
document.getElementById("buildChainBtn").addEventListener("click",()=>{
  const id=parseInt(document.getElementById("chainOrigin").value);
  const origin=missions.find(m=>m.id===id);
  if(!origin){return;}
  const chains=[];
  for(const m2 of missions){
    if(m2.id===origin.id) continue;
    if(m2.origin.toLowerCase()===origin.destination.toLowerCase()){
      chains.push({first:origin,second:m2,totalNet:netProfit(origin)+netProfit(m2),totalKm:origin.distanceKm+m2.distanceKm,totalMin:origin.durationMin+m2.durationMin});
    }
  }

    html+="<tr><td>"+c.first.platform+" "+c.first.origin+"→"+c.first.destination+"</td><td>"+c.second.platform+" "+c.second.origin+"→"+c.second.destination+"</td><td><strong>"+c.totalNet.toFixed(2)+"€</strong></td><td>"+c.totalKm+"</td><td>"+formatDuration(c.totalMin)+"</td></tr>";

const checklistItems=[
 "Initial vehicle condition photos",
 "Initial km registrados",
 "Initial fuel level",
 "Documentation delivered",
 "Digital signature del cliente",
 "Final delivery photos"
];
function renderChecklist(){
  const ul=document.getElementById("checklistItems");
  ul.innerHTML=checklistItems.map((it,i)=>{
    const checked=checklistState.items[i]?"checked":"";
    return "<li><input type='checkbox' data-i='"+i+"' "+checked+"> "+it+"</li>";
  }).join("");
  document.getElementById("startKm").value=checklistState.startKm||0;
  document.getElementById("startFuel").value=checklistState.startFuel||100;
  document.getElementById("signature").value=checklistState.signature||"";
}
document.getElementById("checklistItems").addEventListener("change",(e)=>{
  if(e.target.matches("input[type=checkbox]")){
    checklistState.items[e.target.dataset.i]=e.target.checked;
    saveChecklist();
  }
});
document.getElementById("saveChecklistBtn").addEventListener("click",()=>{
  checklistState.startKm=parseFloat(document.getElementById("startKm").value)||0;
  checklistState.startFuel=parseFloat(document.getElementById("startFuel").value)||0;
  checklistState.signature=document.getElementById("signature").value;
  saveChecklist();
  document.getElementById("checklistStatus").textContent="State saved: "+new Date().toLocaleString();
});
document.getElementById("addProvBtn").addEventListener("click",()=>{
  const name=document.getElementById("provName").value.trim();
  const url=document.getElementById("provUrl").value.trim()||"#";
  if(!name){alert("Name required");return;}
  providers.push({name,url});
  saveProviders();
  document.getElementById("provName").value="";
  document.getElementById("provUrl").value="";
  renderAll();
});
document.getElementById("providersTable").addEventListener("click",(e)=>{
  if(e.target.matches("button[data-del]")){
    const name=e.target.dataset.del;
    providers=providers.filter(p=>p.name!==name);
    saveProviders();
    renderAll();
  }
});
renderChecklist();
renderAll();
</script>
